# XcodeGen spec. Run `xcodegen` in this folder to create Ekimei.xcodeproj.
# Set your own bundle id prefix and team below (or in Xcode's Signing & Capabilities tab).
name: Ekimei
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
targets:
  Ekimei:
    type: application
    platform: iOS
    sources:
      - ios/Ekimei/App
      - ios/Ekimei/Shared
      - path: data/lines.json
        buildPhase: resources
    dependencies:
      - target: EkimeiWidget
    info:
      path: ios/Ekimei/App/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ekimei
  EkimeiWidget:
    type: app-extension
    platform: iOS
    sources:
      - ios/Ekimei/Widget
      - ios/Ekimei/Shared
      - path: data/lines.json
        buildPhase: resources
    info:
      path: ios/Ekimei/Widget/Info.plist
      properties:
        CFBundleDisplayName: Ekimei
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ekimei.widget
